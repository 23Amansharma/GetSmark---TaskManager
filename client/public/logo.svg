
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="w-full h-full drop-shadow-2xl">
                <defs>
                    <linearGradient id="grad-pri" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1d4ed8" />
                        <stop offset="100%" stop-color="#3b82f6" />
                    </linearGradient>
                    <linearGradient id="grad-sec" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#06b6d4" />
                        <stop offset="100%" stop-color="#0891b2" />
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.25" flood-color="#000"/>
                    </filter>
                </defs>
                <g filter="url(#glow)">
                    <!-- Back shadow element for 3D effect -->
                    <path d="M60 15 L100 38 L100 92 L60 115 L20 92 L20 38 Z" fill="#000000" opacity="0.15" transform="translate(0, 4)"/>
                    
                    <!-- Left Blue 'C' shape of the Hexagon -->
                    <path d="M60 15 L20 38 L20 92 L60 115 L60 90 L35 75 L35 55 L60 40 Z" fill="url(#grad-pri)"/>
                    
                    <!-- Right Gold inner crossbar and curve -->
                    <path d="M60 115 L100 92 L100 65 L60 65 L60 90 Z" fill="url(#grad-sec)"/>
                    
                    <!-- Top Right Gold Accent -->
                    <path d="M60 15 L100 38 L100 50 L60 50 L60 40 Z" fill="url(#grad-sec)"/>
                </g>
            </svg>
            